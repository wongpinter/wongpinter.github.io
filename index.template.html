        <h1>Sugeng Supriyadi (wongpinter)</h1>
        <p><strong>Senior Backend &amp; Mobile Engineer · 12+ Years Experience · Jakarta, Indonesia</strong></p>
        <p>
          I build systems that move data reliably — API gateways, real-time pipelines, change-data-capture (CDC), message brokers, CLI tools, and native Android applications. Go is my daily driver, and I ship production systems in Python, TypeScript, and Kotlin.
        </p>
        <p><em>Insinyur perangkat lunak senior dari Jakarta dengan pengalaman 12+ tahun membangun sistem terdistribusi, pipeline CDC, API gateway, dan aplikasi mobile Android di Go, Python, TypeScript, dan Kotlin.</em></p>

        <h2>Featured Engineering Projects / Karya Terpilih</h2>
        <ul>
          <li><strong><a href="https://github.com/wongpinter/walstream" style="color:#38bdf8;">WALSTREAM</a></strong> — High-performance PostgreSQL Write-Ahead Log Change Data Capture (CDC) engine streaming changes to RabbitMQ and message brokers (Go, PostgreSQL, RabbitMQ).</li>
          <li><strong><a href="https://github.com/wongpinter/komiyomi-ext" style="color:#38bdf8;">Komiyomi Ext</a></strong> — Production Android manga, comic (CBZ/CBR), EPUB, and PDF reader app with source extensions, trackers, and material design (Kotlin, Android).</li>
          <li><strong><a href="https://github.com/wongpinter/agent-property-mcp" style="color:#38bdf8;">Agent Property MCP</a></strong> — Production-ready Model Context Protocol (MCP) server implementation in Go supporting multiple transports (Go, MCP, AI).</li>
          <li><strong><a href="https://github.com/wongpinter/ketawa-reader-app" style="color:#38bdf8;">Ketawa Reader</a></strong> — Modern, distraction-free, offline-first Android reader app for Ketawa.com humor archive with bilingual i18n (Kotlin, Jetpack Compose, Room SQLite).</li>
          <li><strong><a href="https://github.com/wongpinter/gdm" style="color:#38bdf8;">GDM</a></strong> — Terminal download manager with segmented HTTP and BitTorrent download engines (Go, BitTorrent).</li>
          <li><strong><a href="https://github.com/wongpinter/MemoDirector" style="color:#38bdf8;">MemoDirector</a></strong> — Local-first PAO memory trainer web application with AI casting and Anki flashcard deck export (TypeScript, React 19, Gemini).</li>
          <li><strong><a href="https://github.com/wongpinter/go-whatsapp" style="color:#38bdf8;">Go-WhatsApp</a></strong> — Type-safe Go library for the WhatsApp Business Cloud API covering messaging, webhooks, templates, and flows (Go).</li>
          <li><strong><a href="https://github.com/wongpinter/inktrace" style="color:#38bdf8;">InkTrace</a></strong> — Handwriting worksheet generator running entirely client-side with HTML5 Canvas and print-ready PDF export (TypeScript, Canvas).</li>
        </ul>

        <h2>Core Skills &amp; Stack / Keahlian</h2>
        <p><strong>Primary Backend:</strong> Go (Golang), PostgreSQL, WAL/CDC, RabbitMQ, Redis, gRPC, REST, Python (FastAPI/Django), PHP (Laravel).</p>
        <p><strong>Mobile:</strong> Kotlin, Android, Jetpack Compose, Room SQLite, Flutter / Dart.</p>
        <p><strong>Frontend:</strong> React 19, Next.js, TypeScript, Tailwind CSS, HTML5 Canvas.</p>
        <p><strong>AI &amp; Automation:</strong> Model Context Protocol (MCP), LLM Agent Workflows, Gemini API, Cloudflare Workers.</p>
